<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>???</title>
    <link rel="stylesheet" href="../static/css/common.css">
    <link rel="stylesheet" href="../static/css/stand.css">
</head>
<body>
<div class="context">
    <div class="header"><h1>Заголовок</h1></div>
    <form class="standForm" th:action="@{register}" method="post" th:object="${registerUserDto}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="formItem">
            <div class="formItemInfo">
                Описание.
            </div>
            <div class="formItemError" th:if="${#fields.hasErrors('fieldName')}" th:errors="*{fieldName}"></div>
            <div class="formItemError" th:if="${} != null}">
                <span th:text="${}">ошибка</span>
            </div>
            <div class="formItemLabel">название:</div>
            <div class="formItemField">
                <input name="nick" id="nick" type="text" autofocus th:field="*{nick}"/>
            </div>
        </div>
        <input type="submit" class="formButton" value="регистрация">
        <div class="techInfo" th:if="${debugSessionId != null}">
            <span th:text="${debugSessionId}"></span>
        </div>
    </form>
</div>
</body>
</html>
