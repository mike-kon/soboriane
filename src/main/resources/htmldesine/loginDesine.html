<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
<div>
    <div class="context">
        <div class="header"><h1>Авторизация</h1></div>
        <div id="loginInfo" class="loginInfo"></div>
        <form class="loginForm" action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <table>
                <tr >
                    <td>Логин</td>
                    <td><input name="user" id="user" type="text" autofocus/></td>
                </tr>
                <tr>
                    <td>Пароль</td>
                    <td><input name="password" type="password"/></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" class="loginButton" value="Ок"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="button" class="loginButton" value="Регистрация"
                               onclick="window.location.href='/register'"/>
                    </td>
                </tr>
            </table>
        </form>
        <div class="info">Если у Вас нет логина, зарегистрируйтесь.</div>
    </div>
</div>
</body>
</html>
