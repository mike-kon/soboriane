<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пароль</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div>
    <div class="context">
        <div class="header"><h1>Задайте пароль</h1></div>
        <div id="loginInfo" class="loginInfo" th:if="${#ctx.containsVariable('loginError')}">
            <span th:text="${loginError}"></span>
        </div>
        <form class="loginForm" action="/login" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <!-- TODO: Тут все от логина. а нужен пароль. ->
            <table>
                <tr>
                    <td>Логин</td>
                    <td><input name="user" id="user" type="text" autofocus/></td>
                </tr>
                <tr>
                    <td>Пароль</td>
                    <td><input name="password" type="password"/></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" class="loginButton" value="Ок"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                    </td>
                </tr>
            </table>
        </form>
        <div class="info">Если у Вас нет логина, зарегистрируйтесь.</div>
        <input type="button" class="loginButton" value="Регистрация"
               onclick="window.location.href='/register'"/>
    </div>
</div>
</body>
</html>
