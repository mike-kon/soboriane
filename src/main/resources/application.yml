server:
  port: 9001
spring:
  application:
    name: soboriane
    version: 0.0.1
  mvc:
    view:
      prefix:
      suffix: .html
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      schema: soboriane
  liquibase:
    enabled: ${LIQUIBASE:true}
    default-schema: soboriane
    liquibase-schema: liquibase
    change-log: db/changelog/db.changelog-master.xml
logging:
  level:
    root: info
    web: debug
    com.mikesoft.soboriane: trace

