server:
  port: ${APP_SERVER:9001}

spring:
  application:
    name: soboriane
    version: 0.0.1
  mvc:
    view:
      prefix:
      suffix: .html
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      schema: soboriane
  liquibase:
    enabled: ${LIQUIBASE:true}
    default-schema: soboriane
    liquibase-schema: liquibase
    change-log: db/changelog/db.changelog-master.xml
  jpa:
    show-sql: true

app:
  user:
    day-to-registration: 3
    password-settings:
      control: ${PASSWORD_CONTROL:true}
      min-len-password: 8
      min-digital: 2
      other-register-count: 1
      min-punctuation: 1
      password-live: P1Y
  web:
    show-debug-element: ${SHOW_DEBUG_ELEMENT:false}
    register-unknown-users: ${REGISTER_UNKNOWN_USER:disabled}
  client-configuration:
    endpoint: "/ws-work"
    brokerPrefix:
      "/topic"
    applicationPrefix: "/app"
    userPrefix: "/user"
    topic: "/topic/message"
    max-retry-connect: 3
    time-out-value: 2000

logging:
  level:
    root: info
    web: debug
    com.mikesoft.soboriane: debug
    org.springframework.security: debug
    sql: debug


